# Bygger en binær pr. platform med Bun, når et tag som v1.2.3 pushes, og
# lægger dem sammen med thehome.json på en GitHub-release. TheHome
# installerer derfra.
#
# Linux bruger Buns glibc-udgaver: Buns musl-udgaver kræver musl-loaderen,
# som TheHomes Debian-image ikke har. x64 bruger "baseline", så binæren
# også kører på ældre CPU'er uden AVX2.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # domænet fra thehome.json
  DOMAIN: example_counter_node

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Kompilér
        run: |
          mkdir dist
          build() { bun build --compile --minify --target="$1" src/main.js --outfile "dist/$DOMAIN-$2"; }
          build bun-windows-x64-baseline x86_64-pc-windows-msvc.exe
          build bun-linux-x64-baseline   x86_64-unknown-linux-gnu
          build bun-linux-arm64          aarch64-unknown-linux-gnu
          build bun-darwin-arm64         aarch64-apple-darwin
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      # A release published on github.com already exists; then only add the files.
      - run: |
          # release notes: the commit subjects since the previous tag
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then echo "## Ændringer siden $prev"; else echo "## Ændringer"; fi
            echo
            git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME"
          } > notes.md
          cat notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* thehome.json --clobber
            # keep notes written on github.com, fill in an empty release
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* thehome.json --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
